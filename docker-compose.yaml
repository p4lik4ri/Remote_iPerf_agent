  network-monitor:
    build:
      context: ./network-monitor
      dockerfile: Dockerfile
    # image: p4lik4ri/network-monitor:latest
    container_name: network-monitor
    ports:
      - "8000:8000"  # Map network monitor's port 8000 to host port 8000
    networks:
      - app-network


  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"  # Expose the InfluxDB HTTP API
    volumes:
      - influxdb-data:/var/lib/influxdb2  # Persist InfluxDB data
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=network-monitor-org
      - DOCKER_INFLUXDB_INIT_BUCKET=network-monitor-bucket
      - DOCKER_INFLUXDB_INIT_RETENTION=7d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=4JQlHZu4-CVuKKwJLt39cz5U1Zj0QxeBn-6yi7fgLWZVT_SF-Cq8dQ4y_7LimM2XgC7PCj9jAIN3wg-n-V8F2g==
    networks:
      - app-network

volumes:
  influxdb-data:

networks:
  app-network:
    driver: bridge


# example requests
# "server_ip" is the single source of truth for the iPerf test's
# host/port: it's automatically applied as "-c"/"-p" to server_params
# and client_params, so you never need to repeat it there.
#
# NOTE: unlike iPerf2's connectionless UDP, iPerf3 always opens a TCP
# control channel first (even for UDP tests), so the iPerf port must
# differ from the Flask control API's own port (5000) to avoid a
# conflict. Override it explicitly with "-p" in server_params (e.g.
# "-p 5201", iPerf3's own default) when both run on the same host.
#
# UDP test:
# curl -X POST "http://localhost:8000/start-experiment" \
#      -H "Content-Type: application/json" \
#      -d '{
#          "server_ip": "iperf-server:5000",
#          "server_params": "-i 1 -u -s -p 5201",
#          "client_ip": "iperf-client:5000",
#          "client_params": "-b 1G -i 1 -u",
#          "duration": 20,
#          "repeat": 1
#      }'
#
# TCP test:
# curl -X POST "http://localhost:8000/start-experiment" \
#      -H "Content-Type: application/json" \
#      -d '{
#          "server_ip": "iperf-server:5000",
#          "server_params": "-i 1 -s -p 5201",
#          "client_ip": "iperf-client:5000",
#          "client_params": "-i 1",
#          "duration": 20,
#          "repeat": 1
#      }'
#
# Reverse mode (server sends, client receives/measures):
# curl -X POST "http://localhost:8000/start-experiment" \
#      -H "Content-Type: application/json" \
#      -d '{
#          "server_ip": "iperf-server:5000",
#          "server_params": "-i 1 -u -s -p 5201",
#          "client_ip": "iperf-client:5000",
#          "client_params": "-b 1G -i 1 -u -R",
#          "duration": 20,
#          "repeat": 1
#      }'